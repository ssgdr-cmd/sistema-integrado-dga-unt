<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f2e4e" />
  <meta name="description" content="Maqueta funcional del Sistema Integrado de la Dirección General de Administración de la Universidad Nacional de Trujillo." />
  <title>Sistema Integrado DGA UNT — Maqueta</title>
  <link rel="icon" href="assets/dga-unt-mark.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="brand">
        <img src="assets/dga-unt-mark.svg" alt="DGA UNT" />
        <div class="brand-copy">
          <strong>Sistema Integrado<br>DGA UNT</strong>
          <span>Maqueta funcional</span>
        </div>
      </div>

      <div class="nav-section">
        <div class="nav-label">Dirección</div>
        <button class="nav-btn active" data-view="dashboard"><i class="nav-dot"></i><span>Inicio ejecutivo</span></button>
        <button class="nav-btn" data-view="org"><i class="nav-dot"></i><span>Estructura DGA</span></button>
        <button class="nav-btn" data-view="projects"><i class="nav-dot"></i><span>Proyectos y Gantt</span></button>
      </div>

      <div class="nav-section">
        <div class="nav-label">Unidades</div>
        <button class="nav-btn" data-module="rh"><i class="nav-dot"></i><span>Recursos Humanos</span></button>
        <button class="nav-btn" data-module="abastecimiento"><i class="nav-dot"></i><span>Abastecimiento</span></button>
        <button class="nav-btn" data-module="tesoreria"><i class="nav-dot"></i><span>Tesorería</span></button>
        <button class="nav-btn" data-module="contabilidad"><i class="nav-dot"></i><span>Contabilidad</span></button>
        <button class="nav-btn" data-module="inversiones"><i class="nav-dot"></i><span>Unidad Ejecutora de Inversiones</span></button>
        <button class="nav-btn" data-module="servicios"><i class="nav-dot"></i><span>Servicios Generales</span></button>
      </div>

      <div class="nav-section">
        <div class="nav-label">Gestión</div>
        <button class="nav-btn" data-view="people"><i class="nav-dot"></i><span>Servidores y tareas</span></button>
        <button class="nav-btn" data-view="academic"><i class="nav-dot"></i><span>Personal académico</span></button>
        <button class="nav-btn" data-view="attendance"><i class="nav-dot"></i><span>Asistencia y permanencia</span></button>
        <button class="nav-btn" data-view="norms"><i class="nav-dot"></i><span>Normativa vigente</span></button>
        <button class="nav-btn" data-view="documents"><i class="nav-dot"></i><span>Documentos rápidos</span></button>
        <button class="nav-btn" data-view="reports"><i class="nav-dot"></i><span>Reportes y Excel</span></button>
      </div>
      <div class="sidebar-footer">Demo para presentación institucional.<br>Los datos son ficticios.</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title">Sistema Integrado de la Dirección General de Administración UNT</div>
          <div class="demo-pill">● Datos simulados</div>
        </div>
        <div class="topbar-actions">
          <select id="roleSelect" class="role-select" aria-label="Perfil de acceso simulado">
            <option value="director">Director General de Administración</option>
            <option value="rh">Jefatura de Recursos Humanos</option>
            <option value="abastecimiento">Jefatura de Abastecimiento</option>
            <option value="tesoreria">Jefatura de Tesorería</option>
            <option value="contabilidad">Jefatura de Contabilidad</option>
            <option value="inversiones">Jefatura UEI</option>
            <option value="servicios">Jefatura de Servicios Generales</option>
            <option value="servidor">Servidor / Mi trabajo</option>
          </select>
          <button class="icon-btn" id="openAssistantTop" title="Abrir asistente">IA</button>
        </div>
      </header>

      <section id="appContent" class="content" aria-live="polite"></section>
    </main>
  </div>

  <button class="assistant-fab" id="assistantFab" title="Asistente DGA">IA</button>

  <aside class="assistant-drawer" id="assistantDrawer" aria-label="Asistente DGA">
    <div class="assistant-head">
      <div>
        <h3>Asistente DGA</h3>
        <small>Modo demostración · respuestas sobre la data ficticia</small>
      </div>
      <button class="icon-btn" id="closeAssistant" aria-label="Cerrar">×</button>
    </div>
    <div class="assistant-body" id="assistantBody"></div>
    <div class="assistant-chips">
      <button class="assistant-chip" data-prompt="¿Qué proyectos están retrasados?">Proyectos retrasados</button>
      <button class="assistant-chip" data-prompt="¿Quién llegó tarde hoy?">Tardanzas de hoy</button>
      <button class="assistant-chip" data-prompt="¿Cuál es el saldo de tesorería?">Saldo de Tesorería</button>
      <button class="assistant-chip" data-prompt="¿Qué alertas normativas hay?">Alertas normativas</button>
      <button class="assistant-chip" data-prompt="¿Cómo va Gestión del Rendimiento?">GDR 2026</button>
    </div>
    <form class="assistant-form" id="assistantForm">
      <input id="assistantInput" autocomplete="off" placeholder="Pregunta por tareas, personas, proyectos, saldos, normas..." />
      <button type="submit">Enviar</button>
    </form>
  </aside>

  <div id="modalRoot"></div>
  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
